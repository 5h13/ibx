<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Banner Studio</title>
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gif.js/0.2.0/gif.js"></script>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
  <style>
    :root {
      --bg-dark: #0b1329;
      --panel-bg: #101c3d;
      --card-bg: #182854;
      --accent-footer: #102C57;
      --accent-primary: #12b8ee;
      --accent-primary-rgb: 18, 184, 238;
      --accent-hover: #1e4582;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border: #23376e;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--bg-dark);
      color: var(--text-main);
      height: 100vh;
      overflow: hidden;
    }

    .app-header {
      height: 64px;
      background: linear-gradient(90deg, var(--panel-bg), var(--bg-dark));
      border-bottom: 1px solid var(--border);
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.18);
      display: flex;
      align-items: center;
      padding: 0 20px;
      justify-content: space-between;
    }

    .header-brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .header-logo {
      width: 40px;
      height: 40px;
      border-radius: 10px;
      object-fit: contain;
      background: #ffffff;
      padding: 3px;
      box-shadow: 0 0 0 1px rgba(var(--accent-primary-rgb), 0.35), 0 5px 16px rgba(0, 0, 0, 0.22);
      flex: 0 0 auto;
    }

    .header-brand-mark {
      display: flex;
      align-items: center;
      gap: 9px;
      padding-right: 4px;
    }

    .header-brand-name {
      display: flex;
      flex-direction: column;
      line-height: 1.05;
      min-width: 86px;
    }

    .header-brand-name strong {
      font-size: 12px;
      letter-spacing: 0.6px;
      color: #ffffff;
    }

    .header-brand-name span {
      margin-top: 3px;
      font-size: 8px;
      font-weight: 700;
      letter-spacing: 0.7px;
      color: var(--accent-primary);
      text-transform: uppercase;
    }

    .store-select {
      background: rgba(255,255,255,0.035);
      color: var(--text-main);
      border: 1px solid var(--border);
      font-family: 'Inter', sans-serif;
      font-size: 17px;
      font-weight: 800;
      padding: 4px 8px;
      border-radius: 9px;
      outline: none;
      cursor: pointer;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.02);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .store-select:focus {
      border-color: var(--accent-primary);
    }

    .header-title-text {
      font-size: 17px;
      font-weight: 700;
      letter-spacing: 0.5px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .header-title-text span {
      background: var(--accent-primary);
      color: #000;
      font-size: 10px;
      font-weight: 800;
      padding: 3px 8px;
      border-radius: 4px;
      text-transform: uppercase;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
    }

    .header-guide-label {
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.8px;
      color: var(--text-muted);
      text-transform: uppercase;
      transition: color 0.2s;
    }

    .header-right:hover .header-guide-label {
      color: var(--accent-primary);
    }

    .help-btn {
      background: var(--card-bg);
      color: var(--text-main);
      border: 1px solid var(--border);
      border-radius: 50%;
      width: 28px;
      height: 28px;
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
    }

    .header-right:hover .help-btn {
      background: var(--accent-hover);
      border-color: var(--accent-primary);
    }

    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.7);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }

    .modal-content {
      background: var(--panel-bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      width: 480px;
      max-width: 90%;
      padding: 24px;
      position: relative;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 12px;
    }

    .modal-header h2 {
      font-size: 16px;
      color: var(--accent-primary);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .modal-close {
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 18px;
      cursor: pointer;
    }

    .modal-close:hover {
      color: white;
    }

    .guide-list {
      display: flex;
      flex-direction: column;
      gap: 14px;
      font-size: 13px;
      line-height: 1.5;
    }

    .guide-item-title {
      font-weight: 700;
      color: var(--text-main);
      margin-bottom: 2px;
    }

    .guide-item-desc {
      color: var(--text-muted);
    }

    .app-container {
      display: flex;
      height: calc(100vh - 60px);
    }

    .sidebar {
      width: 380px;
      background: var(--panel-bg);
      border-right: 1px solid var(--border);
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .sidebar::-webkit-scrollbar {
      width: 6px;
    }
    .sidebar::-webkit-scrollbar-thumb {
      background: var(--border);
      border-radius: 3px;
    }

    .card {
      background: linear-gradient(180deg, rgba(255,255,255,0.025), rgba(255,255,255,0.008)), var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      box-shadow: 0 8px 22px rgba(0, 0, 0, 0.10);
    }

    .card-title {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--accent-primary);
      margin-bottom: 12px;
    }

    .file-dropzone {
      border: 2px dashed var(--border);
      border-radius: 10px;
      padding: 14px;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s;
      background: rgba(255, 255, 255, 0.02);
    }

    .file-dropzone:hover {
      border-color: var(--accent-primary);
      background: rgba(var(--accent-primary-rgb), 0.07);
    }

    .file-dropzone input {
      display: none;
    }

    .control-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
      font-size: 13px;
    }

    .control-row:last-child {
      margin-bottom: 0;
    }

    .control-row span {
      color: var(--text-muted);
    }

    .range-wrapper {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    input[type="range"] {
      accent-color: var(--accent-primary);
      width: 140px;
    }

    .input-field {
      width: 100%;
      background: var(--bg-dark);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 8px 12px;
      color: white;
      font-size: 13px;
      margin-top: 4px;
      margin-bottom: 10px;
      outline: none;
      text-transform: uppercase;
    }

    .input-field:focus {
      border-color: var(--accent-primary);
    }

    .btn {
      width: 100%;
      padding: 10px 16px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      border: none;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn-primary {
      background: var(--accent-primary);
      color: #000;
    }

    .btn-primary:hover:not(:disabled) {
      background: color-mix(in srgb, var(--accent-primary) 86%, white);
    }

    .btn-secondary {
      background: var(--accent-hover);
      color: var(--text-main);
    }

    .btn-secondary:hover:not(:disabled) {
      filter: brightness(1.2);
    }

    .btn-success {
      background: #10b981;
      color: #ffffff;
    }

    .btn-success:hover:not(:disabled) {
      background: #059669;
    }

    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .workspace {
      flex: 1;
      background: var(--bg-dark);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      position: relative;
      overflow: auto;
      gap: 20px;
    }

    .canvas-container {
      background: #FFFFFF;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
      border: 2px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
      max-height: 65vh;
      aspect-ratio: 1;
      display: flex;
    }

    canvas {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .horizontal-reel {
      display: flex;
      align-items: center;
      gap: 12px;
      background: var(--panel-bg);
      border: 1px solid var(--border);
      padding: 12px 16px;
      border-radius: 10px;
      max-width: 90%;
      overflow-x: auto;
    }

    .horizontal-reel::-webkit-scrollbar {
      height: 6px;
    }

    .horizontal-reel::-webkit-scrollbar-thumb {
      background: var(--border);
      border-radius: 3px;
    }

    .thumb-item {
      width: 64px;
      height: 64px;
      flex-shrink: 0;
      border-radius: 6px;
      border: 2px solid transparent;
      position: relative;
      overflow: hidden;
      cursor: pointer;
      background: #ffffff;
      transition: transform 0.15s ease, border-color 0.15s ease;
    }

    .thumb-item:hover {
      transform: translateY(-2px);
    }

    .thumb-item.active {
      border-color: var(--accent-primary);
      box-shadow: 0 0 10px rgba(var(--accent-primary-rgb), 0.35);
    }

    .thumb-item img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .thumb-delete {
      position: absolute;
      top: 2px;
      right: 2px;
      background: rgba(0, 0, 0, 0.75);
      color: #ef4444;
      border-radius: 50%;
      width: 16px;
      height: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 9px;
      opacity: 0;
      transition: opacity 0.2s;
    }

    .thumb-item:hover .thumb-delete {
      opacity: 1;
    }

    .gif-preview-container {
      text-align: center;
    }

    .gif-preview-container img {
      max-height: 150px;
      border-radius: 8px;
      border: 1px solid var(--border);
    }

    @media (max-width: 980px) {
      .app-header {
        height: auto;
        min-height: 64px;
        padding: 8px 12px;
        gap: 8px;
      }
      .header-brand {
        min-width: 0;
        flex-wrap: wrap;
        gap: 7px;
      }
      .header-brand-mark { padding-right: 0; }
      .header-brand-name { display: none; }
      .header-title-text { display: none; }
      .header-right .header-guide-label { display: none; }
      .store-select { font-size: 13px; max-width: 145px; }
      .header-brand > div:last-child { margin-left: 0 !important; }
      .app-header .btn { font-size: 10px !important; padding: 6px 8px !important; }
    }

    @media (max-width: 720px) {
      .app-header {
        align-items: center;
        flex-wrap: wrap;
      }
      .header-brand { width: 100%; }
      .header-brand-mark { margin-right: auto; }
      .header-logo { width: 36px; height: 36px; }
      .header-brand .store-select { flex: 1 1 125px; min-width: 0; }
      .header-right { position: absolute; right: 10px; top: 10px; }
      .workspace { padding: 12px; gap: 12px; }
      .sidebar { width: min(100%, 380px); }
    }
  


    /* Store UI themes: same UI structure, brand-specific color variables */
    .app-shell.pili-theme {
      --bg-dark: #C9F0FC; --panel-bg: #E8F9FE; --card-bg: #FFFFFF;
      --accent-footer: #08A9E8; --accent-primary: #08A9E8; --accent-primary-rgb: 8, 169, 232;
      --accent-hover: #0789C2; --text-main: #073B5C; --text-muted: #4B7185; --border: #A9DFF2;
    }
    .app-shell.aton-theme {
      --bg-dark: #17070b; --panel-bg: #260b12; --card-bg: #3a111a;
      --accent-footer: #7b1e2b; --accent-primary: #9f2938; --accent-primary-rgb: 159, 41, 56;
      --accent-hover: #6b1727; --text-main: #fff7f8; --text-muted: #c9aeb3; --border: #5c1321;
    }
    .app-shell.ishabella-theme {
      --bg-dark: #040a14; --panel-bg: #061021; --card-bg: #0a1a33;
      --accent-footer: #0A1A33; --accent-primary: #1b66b1; --accent-primary-rgb: 27, 102, 177;
      --accent-hover: #122a52; --text-main: #f5f8ff; --text-muted: #9aabc4; --border: #132d57;
    }

    /* PILI-AIRE modern visual system */
    .app-shell {
      --bg-dark: #C9F0FC;
      --panel-bg: #E8F9FE;
      --card-bg: #FFFFFF;
      --accent-footer: #08A9E8;
      --accent-primary: #08A9E8;
      --accent-primary-rgb: 8, 169, 232;
      --accent-hover: #0789C2;
      --text-main: #073B5C;
      --text-muted: #4B7185;
      --border: #A9DFF2;
      color: var(--text-main);
      background: var(--bg-dark);
    }

    .app-shell .app-header {
      height: 76px;
      padding: 0 22px;
      background: linear-gradient(100deg, #A9E3FA 0%, #CFF3FD 58%, #9DDEFA 100%);
      border-bottom: 1px solid rgba(7, 137, 194, 0.20);
      box-shadow: 0 5px 22px rgba(7, 137, 194, 0.13);
      color: #073B5C;
    }

    .app-shell .header-logo {
      width: 50px;
      height: 50px;
      padding: 2px;
      border-radius: 14px;
      background: rgba(255,255,255,.82);
      box-shadow: 0 0 0 1px rgba(8,169,232,.28), 0 6px 18px rgba(0,100,160,.14);
    }

    .app-shell .header-brand-name strong { color: #07527B; font-size: 13px; }
    .app-shell .header-brand-name span { color: #0789C2; }
    .app-shell .store-select {
      color: #07527B;
      background: rgba(255,255,255,.58);
      border-color: rgba(8,169,232,.30);
    }
    .app-shell .header-title-text { color: #07527B; }
    .app-shell .header-title-text span { color: #fff; background: #08A9E8; }
    .app-shell .header-guide-label { color: #176381; }
    .app-shell .help-btn { background: rgba(255,255,255,.6); color:#07527B; border-color: rgba(8,169,232,.3); }

    .app-shell .app-container {
      height: calc(100vh - 76px);
      background: linear-gradient(135deg, #F4FCFF 0%, #E8F9FE 48%, #D4F3FC 100%);
      gap: 0;
    }

    .app-shell .tool-rail {
      width: 330px;
      flex: 0 0 330px;
      padding: 18px 16px;
      overflow-y: auto;
      background: rgba(255,255,255,.72);
      border-right: 1px solid rgba(89,190,225,.24);
    }

    .app-shell .rail-section-title {
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 1px;
      color: #075B92;
      margin: 2px 2px 10px;
    }

    .app-shell .layout-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    .app-shell .layout-tile {
      min-height: 92px;
      padding: 8px 5px;
      border: 1px solid #B8E4F4;
      border-radius: 11px;
      background: rgba(255,255,255,.76);
      color: #075B92;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      transition: .18s ease;
    }
    .app-shell .layout-tile:hover { transform: translateY(-1px); border-color:#35B7E8; box-shadow:0 5px 15px rgba(0,140,200,.10); }
    .app-shell .layout-tile.active { border: 2px solid #08A9E8; background: linear-gradient(180deg,#E7F9FE,#D7F3FC); box-shadow:0 5px 16px rgba(8,169,232,.16); }
    .app-shell .layout-tile-icon { font-size: 22px; line-height:1; color:#08A9E8; }
    .app-shell .layout-tile strong { font-size: 11px; letter-spacing:.2px; }
    .app-shell .layout-tile small { font-size: 9px; color:#5B8193; }

    .app-shell .rail-divider { height:1px; background:#C5EAF6; margin:18px 0 15px; }
    .app-shell .store-card {
      width:100%; border:1px solid #B8E4F4; background:rgba(255,255,255,.78); border-radius:10px;
      padding:9px 10px; display:flex; align-items:center; gap:10px; text-align:left; cursor:pointer; color:#075B92;
    }
    .app-shell .store-card img { width:38px; height:38px; object-fit:contain; border-radius:9px; background:white; }
    .app-shell .store-card span { display:flex; flex-direction:column; flex:1; }
    .app-shell .store-card strong { font-size:13px; }
    .app-shell .store-card small { font-size:9px; color:#5B8193; margin-top:2px; }
    .app-shell .store-card b { font-size:17px; color:#0789C2; }

    .app-shell .rail-menu { margin-top:10px; border:1px solid #BFE5F3; border-radius:10px; overflow:hidden; background:rgba(255,255,255,.64); }
    .app-shell .rail-menu div { height:42px; display:flex; align-items:center; gap:11px; padding:0 12px; border-bottom:1px solid #D9F0F8; color:#075B92; font-size:12px; }
    .app-shell .rail-menu div:last-child { border-bottom:0; }
    .app-shell .rail-menu span { width:17px; text-align:center; color:#08A9E8; font-weight:800; }
    .app-shell .rail-menu b { margin-left:auto; color:#2E8CB5; font-size:17px; font-weight:400; }

    .app-shell .rail-brand-card {
      margin-top:18px; padding:16px 12px; min-height:130px; border-radius:11px; overflow:hidden;
      background:linear-gradient(145deg,#DFF7FD,#A9E3FA); border:1px solid #A6DEEF; position:relative; color:#075B92;
    }
    .app-shell .rail-brand-card:after { content:""; position:absolute; width:180px; height:55px; right:-35px; bottom:-20px; border-top:8px solid rgba(8,169,232,.35); border-radius:50%; transform:rotate(-10deg); }
    .app-shell .rail-brand-card img { width:48px; height:48px; object-fit:contain; background:rgba(255,255,255,.7); border-radius:12px; float:left; margin-right:10px; }
    .app-shell .rail-brand-card strong { display:block; padding-top:4px; font-size:18px; }
    .app-shell .rail-brand-card small { display:block; margin-top:4px; font-size:10px; color:#2A6B89; }

    .app-shell .sidebar {
      width: 300px; flex:0 0 300px; order:3; background:rgba(255,255,255,.60); border-left:1px solid rgba(89,190,225,.24); border-right:0;
      padding:18px 14px; gap:12px;
    }
    .app-shell .card { background:rgba(255,255,255,.82); border:1px solid #BCE5F3; border-radius:11px; padding:14px; box-shadow:0 7px 18px rgba(0,100,160,.06); }
    .app-shell .card-title { color:#087DB5; font-size:10px; letter-spacing:1px; }
    .app-shell .file-dropzone { border-color:#8DD5EE; background:#F3FCFF; color:#286B85; }
    .app-shell .input-field { background:#F8FDFF; color:#073B5C; border-color:#B5DFEF; }
    .app-shell .input-field::placeholder { color:#79A0B2; }
    .app-shell .btn-secondary { background:#DDF4FB; color:#075B92; border:1px solid #B3E1F1; }
    .app-shell .btn-primary { background:#08A9E8; color:#fff; box-shadow:0 5px 14px rgba(8,169,232,.20); }
    .app-shell .btn-success { background:#0789C2; color:#fff; }

    .app-shell .workspace { order:2; background:radial-gradient(circle at 50% 34%,rgba(255,255,255,.96) 0%,rgba(237,250,254,.88) 45%,rgba(211,244,252,.75) 100%); padding:18px 22px 22px; justify-content:flex-start; }
    .app-shell .workspace-toolbar { width:min(900px,94%); min-height:54px; display:flex; align-items:center; justify-content:space-between; gap:15px; padding:8px 14px; border:1px solid #BFE6F3; background:rgba(255,255,255,.74); border-radius:11px; box-shadow:0 5px 16px rgba(0,100,160,.06); color:#075B92; }
    .app-shell .workspace-kicker { display:block; font-size:9px; letter-spacing:1px; color:#08A9E8; font-weight:800; margin-bottom:2px; }
    .app-shell .workspace-toolbar strong { font-size:13px; }
    .app-shell .preview-meta { display:flex; gap:7px; flex-wrap:wrap; justify-content:flex-end; }
    .app-shell .preview-meta span { font-size:10px; padding:6px 9px; border-radius:7px; background:#E7F8FD; border:1px solid #C3E8F4; color:#1A6B89; }

@media (max-width:700px) {
  .desktop-only-mobile { display:none !important; }
  .mobile-only { display:block; }

  body { overflow-x:hidden; }
  .app-shell { min-width:0 !important; width:100%; }
  .app-header {
    position:sticky !important; top:0; z-index:50;
    height:auto !important; min-height:58px;
    padding:7px 10px !important;
  }
  .header-left { min-width:0; flex:1 1 auto; }
  .header-brand-name { min-width:0; }
  .header-brand-name strong { font-size:11px !important; }
  .header-brand-name span { font-size:9px !important; }
  .header-logo { width:42px !important; height:42px !important; }
  .header-right { display:none !important; }

  .app-container {
    height:auto !important; min-height:calc(100vh - 58px) !important;
    display:block !important; overflow:visible !important;
    padding-bottom:74px;
  }

  /* Hide the desktop navigation rail only on phones. */
  .tool-rail { display:none !important; }

  .workspace {
    width:100% !important; min-width:0 !important;
    min-height:0 !important; padding:10px !important;
    display:flex !important; flex-direction:column !important;
  }
  .workspace-toolbar {
    width:100% !important; min-width:0 !important;
    flex-wrap:wrap !important; gap:6px !important;
  }
  .canvas-container {
    width:100% !important; max-width:100% !important;
    max-height:none !important;
    overflow:auto !important;
    padding:8px !important;
  }
  .canvas-container canvas {
    max-width:100% !important;
    height:auto !important;
    touch-action:none;
  }
  .preview-meta { font-size:10px !important; }

  /* Desktop sidebar becomes a mobile bottom sheet. */
  .sidebar {
    display:none !important;
    width:100% !important; min-width:0 !important;
    padding:10px !important;
    border:0 !important;
    background:transparent !important;
  }
  .sidebar.mobile-panel-open {
    display:block !important;
    position:fixed !important;
    left:0; right:0; bottom:58px;
    max-height:72vh;
    overflow-y:auto;
    z-index:45;
    padding:12px !important;
    border-radius:18px 18px 0 0;
    box-shadow:0 -10px 35px rgba(0,0,0,.20);
  }
  .sidebar.mobile-panel-open .panel-stack { display:block !important; }
  .sidebar.mobile-panel-open .card { margin-bottom:10px; }

  .mobile-layout-strip {
    display:flex !important; gap:7px; overflow-x:auto;
    padding:2px 0 8px; scrollbar-width:none;
    -webkit-overflow-scrolling:touch;
  }
  .mobile-layout-strip::-webkit-scrollbar { display:none; }
  .mobile-layout-btn {
    flex:0 0 78px; min-height:52px;
    border-radius:11px; border:1px solid rgba(120,120,120,.22);
    background:rgba(255,255,255,.8);
    padding:6px 4px; font-size:9px; font-weight:800;
    touch-action:manipulation;
  }
  .mobile-layout-btn.active { box-shadow:0 0 0 2px currentColor inset; }

  .mobile-sheet-close {
    width:100%; min-height:42px; border:0; border-radius:10px;
    font-weight:800; margin-bottom:8px; touch-action:manipulation;
  }

  .mobile-bottom-nav {
    position:fixed; left:0; right:0; bottom:0; z-index:60;
    height:62px; display:grid; grid-template-columns:repeat(6,1fr);
    gap:2px; padding:5px 4px calc(5px + env(safe-area-inset-bottom));
    box-sizing:content-box;
    background:rgba(255,255,255,.96);
    backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
    border-top:1px solid rgba(120,120,120,.20);
    box-shadow:0 -5px 18px rgba(0,0,0,.10);
  }
  .mobile-nav-btn {
    border:0; background:transparent; border-radius:10px;
    display:flex; flex-direction:column; align-items:center;
    justify-content:center; gap:2px; min-width:0;
    font-size:9px; font-weight:800; line-height:1.1;
    touch-action:manipulation;
  }
  .mobile-nav-btn span:first-child { font-size:17px; line-height:18px; }
  .mobile-nav-btn.active { background:rgba(80,150,190,.12); }

  .mobile-top-controls {
    display:grid !important; grid-template-columns:1fr 1fr;
    gap:7px; margin-bottom:8px;
  }
  .mobile-top-controls button, .mobile-top-controls select {
    min-height:42px; width:100%; border-radius:10px;
    font-size:11px; font-weight:800; padding:0 9px;
  }

  .file-dropzone { min-height:72px !important; }
  .input-field { min-height:42px !important; font-size:16px !important; }
  input[type="range"] { min-height:30px; }
  .btn { min-height:42px !important; touch-action:manipulation; }
}


    .brand-manager-grid { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
    .brand-manager-grid .full { grid-column:1 / -1; }
    @media (max-width:700px) { .brand-manager-grid { grid-template-columns:1fr; } }
</style>

      const delay=Math.max(900,gifDuration);for(let frame=1;frame<=5;frame++){announcementFrameOverrideRef.current=frame;renderSingleImageToCanvas(null,0);gif.addFrame(canvas,{delay,copy:true});}announcementFrameOverrideRef.current=null;

                    disabled={!activeImage}
                    value={bannerLayout === "SQUARE2" ? currentSquare2Scale : currentScale}
                    onChange={(e) => bannerLayout === "SQUARE2"
                      ? handleSquare2ScaleChange(parseFloat(e.target.value))
                      : handleScaleChange(parseFloat(e.target.value))}
                  />
                </div>
              </div>
              {bannerLayout === "SQUARE2" && (
                <div style={{fontSize: '12px', color: 'var(--text-muted)', marginTop: '6px'}}>
                  Adjust the product image size inside the image area. The lower band fades in gradually from transparent to opaque.
                </div>
              )}
            </div>
          )}

          {isCreateGifLayout && (
            <div className="card">
              <div className="card-title">Pure GIF Creator</div>
              <div style={{fontSize: '12px', color: 'var(--text-muted)'}}>Upload photos and create a GIF using one photo per frame. No banner design, branding, text, or minimum duration is applied.</div>
              <div className="panel-stat" style={{marginTop:'8px'}}>{productImages.length} frame{productImages.length === 1 ? '' : 's'} · {gifDuration} ms each</div>
            </div>
          )}

          {bannerLayout !== "SQUARE1" && bannerLayout !== "SQUARE2" && !isInfoLayout && !isCreateGifLayout && (
            <div className="card">
              <div className="card-title">Layout Note</div>
              <div style={{fontSize: '12px', color: 'var(--text-muted)'}}>
                This layout auto-fits the selected image — drag/scale positioning is available on Square Banner1 and image-size adjustment is available on Square Banner2.
              </div>
            </div>
          )}

          {isInfoLayout && (
            <div className="card">
              <div className="card-title">Info Banner Mode</div>
              <div style={{display: 'flex', flexDirection: 'column', gap: '8px', marginBottom: '4px'}}>
                <label style={{display: 'flex', alignItems: 'center', gap: '8px', fontSize: '13px', cursor: 'pointer'}}>
                  <input
                    type="radio"
                    name="infoMode"
                    checked={infoMode === "CYCLE"}
                    onChange={() => setInfoMode("CYCLE")}
                  />
                  Cycle all images (Angle 1/{productImages.length || 1}, GIF export)
                </label>
                <label style={{display: 'flex', alignItems: 'center', gap: '8px', fontSize: '13px', cursor: 'pointer'}}>
                  <input
                    type="radio"
                    name="infoMode"
                    checked={infoMode === "STATIC"}
                    onChange={() => setInfoMode("STATIC")}
                  />
                  Static: 2-3 images side by side
                </label>
              </div>
              {infoMode === "STATIC" && (
                <div style={{fontSize: '12px', color: 'var(--text-muted)', marginTop: '6px'}}>
                  Selected {staticImageIds.length}/3 — tap the checkbox on thumbnails below to choose.
                </div>
              )}
            </div>
          )}

          <div className="card">
            <div className="card-title">{isInfoLayout ? "PROMO TEXT" : "PRODUCT DETAILS"}</div>
            <input className="input-field" type="text" value={rightLine1Text} onChange={(e) => setRightLine1Text(e.target.value.toUpperCase())} placeholder={isInfoLayout ? "HEADLINE (E.G. TOYOTA ALTIS 2014)" : ""} />
            <div className="control-row">
              <span>Size</span>
              <input type="range" min="10" max="60" value={rightLine1Font} onChange={(e) => setRightLine1Font(parseInt(e.target.value, 10))} />
            </div>

            <input className="input-field" type="text" value={rightLine2Text} onChange={(e) => setRightLine2Text(e.target.value.toUpperCase())} placeholder={isInfoLayout ? "SUBHEADLINE / OFFER DETAILS" : ""} />
            <div className="control-row">
              <span>Size</span>
              <input type="range" min="10" max="60" value={rightLine2Font} onChange={(e) => setRightLine2Font(parseInt(e.target.value, 10))} />
            </div>

            {!isInfoLayout && (
              <React.Fragment>
                <input className="input-field" type="text" value={rightLine3Text} onChange={(e) => setRightLine3Text(e.target.value.toUpperCase())} />
                <div className="control-row" style={{marginBottom: '12px'}}>
                  <span>Size</span>
                  <input type="range" min="10" max="40" value={rightLine3Font} onChange={(e) => setRightLine3Font(parseInt(e.target.value, 10))} />
                </div>
              </React.Fragment>
            )}

            {bannerLayout === "INFO1" && (
              <React.Fragment>
                <div className="text-control-block"><label>INFO1 Category Text</label><input className="input-field" type="text" value={info1CategoryText} onChange={(e) => setInfo1CategoryText(e.target.value.toUpperCase())} /></div>
                <div className="text-control-block"><label>INFO1 Shared Feature Text</label><input className="input-field" type="text" value={info1FeatureText} onChange={(e) => setInfo1FeatureText(e.target.value.toUpperCase())} /><div className="panel-hint">This single input updates both the top header feature text and the lower INFO1 feature text.</div></div>
              </React.Fragment>
            )}

            {bannerLayout === "INFO2" && (
              <React.Fragment>
                <div className="text-control-block"><label>INFO2 Feature Text</label><input className="input-field" type="text" value={info2FeatureText} onChange={(e) => setInfo2FeatureText(e.target.value.toUpperCase())} /></div>
                <div className="text-control-block"><label>INFO2 Description Text</label><input className="input-field" type="text" value={info2DescriptionText} onChange={(e) => setInfo2DescriptionText(e.target.value.toUpperCase())} /></div>
              </React.Fragment>
            )}

            <button className="btn btn-success" onClick={handleSaveProductSizes}>
              {saveSizesStatus}
            </button>
          </div>

          <div className="card">
            <div className="card-title">Export Options</div>

            {isInfoLayout && infoMode === "STATIC" ? (
              <div style={{display: 'flex', flexDirection: 'column', gap: '8px'}}>
                <button className="btn btn-primary" onClick={handleDownloadStaticBanner} disabled={staticImageIds.length < 2}>
                  Download Static Banner PNG
                </button>
              </div>
            ) : (
              <React.Fragment>
                <div className="control-row" style={{marginBottom: '12px'}}>
                  <span>GIF Speed</span>
                  <span>{gifDuration} ms</span>
                </div>
                <input style={{width: '100%', marginBottom: '16px'}} type="range" min="300" max="2000" value={gifDuration} onChange={(e) => setGifDuration(parseInt(e.target.value, 10))} />

                <div style={{display: 'flex', flexDirection: 'column', gap: '8px'}}>
                  <button className="btn btn-secondary" onClick={handleDownloadPNG} disabled={!activeImage}>
                    Download Single PNG
                  </button>
                  <button className="btn btn-secondary" onClick={handleDownloadAllPNGs} disabled={!productImages.length}>
                    Download All PNGs ({productImages.length})
                  </button>
                  <button className="btn btn-primary" onClick={handleGenerateGIF} disabled={!productImages.length || isGeneratingGif}>
                    {isGeneratingGif ? "Exporting GIF..." : `Generate GIF (${productImages.length} frames)`}
                  </button>
                </div>
              </React.Fragment>
            )}
          </div>
          </div>
        </aside>

        <main className="workspace">
          <div className="desktop-preview-shell">
            <div className="workspace-toolbar">
              <div>
                <span className="workspace-kicker">LIVE PREVIEW</span>
                <strong>{currentStore.name} · {bannerLayout.replace("SQUARE", "SQUARE ").replace("INFO", "INFO ")}</strong>
              </div>
              <div className="preview-meta">
                <span>▣ Mobile-first</span>
                <span>{canvasWidth} × {canvasHeight}</span>
                <span>100%</span>
              </div>
            </div>

            <div className="preview-stage">
              <div className="preview-card">
                <div className="preview-card-label">PNG / LIVE PREVIEW</div>
                <div className="canvas-container" style={{ aspectRatio: `${canvasWidth} / ${canvasHeight}` }}>
                  <canvas
                    ref={canvasRef}
                    width={canvasWidth}
                    height={canvasHeight}
                    onMouseDown={handleCanvasDown}
                    onMouseMove={handleCanvasMove}
                    onMouseUp={endDrag}
                    onMouseLeave={endDrag}
                    onTouchStart={handleCanvasDown}
                    onTouchMove={handleCanvasMove}
                    onTouchEnd={endDrag}
                  />
                </div>
              </div>

              <div className={`preview-card ${gifPreviewUrl ? '' : 'empty-gif'}`}>
                <div className="preview-card-label">GIF PREVIEW</div>
                {gifPreviewUrl ? (
                  <div className="gif-preview-container">
                    <img src={gifPreviewUrl} alt="GIF Preview" />
                  </div>
                ) : (
                  <div className="gif-preview-container">
                    <div className="gif-empty-state">Generate a GIF to preview it here.<br />The PNG and GIF previews stay side by side on desktop.</div>
                  </div>
                )}
              </div>

              {productImages.length > 0 && (
                <aside className="thumbnail-side-panel">
              <div className="thumbnail-side-title">UPLOADED<br />IMAGES</div>
              <div className="horizontal-reel">
                {productImages.map(img => {
                  const staticIndex = staticImageIds.indexOf(img.id);
                  const isStaticPicker = isInfoLayout && infoMode === "STATIC";
                  return (
                    <div
                      key={img.id}
                      className={`thumb-item ${img.id === activeImageId ? 'active' : ''}`}
                      draggable
                      onDragStart={() => handleThumbDragStart(img.id)}
                      onDragOver={(e) => e.preventDefault()}
                      onDrop={() => handleThumbDrop(img.id)}
                      onClick={() => isStaticPicker ? toggleStaticImage(img.id) : setActiveImageId(img.id)}
                    >
                      <img src={img.src} alt={img.fileName} />
                      {isStaticPicker && (
                        <div
                          style={{
                            position: 'absolute', top: '2px', left: '2px',
                            width: '18px', height: '18px', borderRadius: '4px',
                            background: staticIndex >= 0 ? 'var(--accent-primary)' : 'rgba(0,0,0,0.55)',
                            color: staticIndex >= 0 ? '#000' : '#fff',
                            display: 'flex', alignItems: 'center', justifyContent: 'center',
                            fontSize: '11px', fontWeight: 800
                          }}
                        >
                          {staticIndex >= 0 ? staticIndex + 1 : ''}
                        </div>
                      )}
                      <div className="thumb-delete" onClick={(e) => { e.stopPropagation(); handleThumbDelete(img.id); }}>✕</div>
                    </div>
                  );
                })}
              </div>
                </aside>
              )}
            </div>
          </div>

          {/* Mobile keeps the original thumbnail reel below the live preview. */}
          <div className="mobile-desktop-thumb-reel">
            {productImages.length > 0 && (
              <div className="horizontal-reel">
                {productImages.map(img => {
                  const staticIndex = staticImageIds.indexOf(img.id);
                  const isStaticPicker = isInfoLayout && infoMode === "STATIC";
                  return (
                    <div key={img.id} className={`thumb-item ${img.id === activeImageId ? 'active' : ''}`} draggable onDragStart={() => handleThumbDragStart(img.id)} onDragOver={(e) => e.preventDefault()} onDrop={() => handleThumbDrop(img.id)} onClick={() => isStaticPicker ? toggleStaticImage(img.id) : setActiveImageId(img.id)}>
                      <img src={img.src} alt={img.fileName} />
                      {isStaticPicker && <div style={{position:'absolute',top:'2px',left:'2px',width:'18px',height:'18px',borderRadius:'4px',background:staticIndex>=0?'var(--accent-primary)':'rgba(0,0,0,0.55)',color:staticIndex>=0?'#000':'#fff',display:'flex',alignItems:'center',justifyContent:'center',fontSize:'11px',fontWeight:800}}>{staticIndex>=0?staticIndex+1:''}</div>}
                      <div className="thumb-delete" onClick={(e)=>{e.stopPropagation();handleThumbDelete(img.id);}}>✕</div>
                    </div>
                  );
                })}
              </div>
            )}
          </div>
        </main>
      </div>

      {showGuide && (
        <div className="modal-overlay" onClick={() => setShowGuide(false)}>
          <div className="modal-content" onClick={(e) => e.stopPropagation()}>
            <div className="modal-header">
              <h2>Quick Start Guide</h2>
              <button className="modal-close" onClick={() => setShowGuide(false)}>✕</button>
            </div>
            <div className="guide-list">
              <div className="guide-item">
                <div className="guide-item-title">1. Store & Layout:</div>
                <div className="guide-item-desc">Pick a store preset (PILI-AIRE, ATON AIRE, ISHABELLA) from the top-left dropdown — logo, colors and contact details switch automatically. Use the second dropdown to choose Square Banner or Info Banner.</div>
              </div>
              <div className="guide-item">
                <div className="guide-item-title">2. Upload Product Images:</div>
                <div className="guide-item-desc">Click Upload Assets to add one or more product photos. Transparent PNGs at 1000 × 1000 px or larger, 1:1 aspect ratio, give the sharpest result.</div>
              </div>
              <div className="guide-item">
                <div className="guide-item-title">3. Square Banner:</div>
                <div className="guide-item-desc">Click and drag the product on the canvas to position it, then use the Scale slider to resize. Set the Product Details text (title, details, spec) in the sidebar.</div>
              </div>
              <div className="guide-item">
                <div className="guide-item-title">4. Info Banner — Cycle Mode:</div>
                <div className="guide-item-desc">Shows one uploaded image at a time with an automatic "Angle X/Y" label and position dots — ideal for exporting an animated GIF that cycles through every angle.</div>
              </div>
              <div className="guide-item">
                <div className="guide-item-title">5. Info Banner — Static Mode:</div>
                <div className="guide-item-desc">Tap 2–3 thumbnails to feature them side by side in one frame — the numbered badge shows the order they'll appear in.</div>
              </div>
              <div className="guide-item">
                <div className="guide-item-title">6. Exporting:</div>
                <div className="guide-item-desc">Square Banner and Info Banner Cycle mode support single PNG, all-frames PNG, and animated GIF export. Info Banner Static mode exports one combined PNG.</div>
              </div>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
